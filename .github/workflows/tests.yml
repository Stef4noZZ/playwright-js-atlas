name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: "Tag expression to run (Playwright --grep)"
        type: string
        default: "@smoke"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_HEADLESS: "true"
        run: npx playwright test --grep "${{ github.event.inputs.grep || '@smoke' }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.browser }}
          path: reports/
          retention-days: 14

  lint:
    name: lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck
